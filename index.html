<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الاحترافي - المحفظة الإلكترونية</title>
    <style>
        :root {
            --deep-blue: #0A192F;
            --calm-teal: #172A45;
            --accent-teal: #64FFDA;
            --gold: #FFD700;
            --text-light: #CCD6F6;
            --bg-color: #020C1B;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            direction: rtl;
        }
        header {
            background-color: var(--deep-blue);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold);
        }
        .logo {
            font-size: 24px;
            color: var(--gold);
            font-weight: bold;
        }
        .hero {
            text-align: center;
            padding: 80px 20px;
        }
        .hero h1 {
            color: var(--accent-teal);
            font-size: 40px;
            margin-bottom: 10px;
        }
        .auth-container {
            background-color: var(--calm-teal);
            max-width: 400px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--gold);
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: var(--deep-blue);
            border: 1px solid var(--accent-teal);
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--gold);
            color: var(--deep-blue);
            border: none;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover {
            background-color: var(--accent-teal);
        }
        #user-info {
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">موقعي الشخصي</div>
        <div id="auth-status">زائر</div>
    </header>

    <div class="hero">
        <h1>مرحباً بك في منصتي الرقمية</h1>
        <p>هذا الموقع مرئي للجميع، ويمكنك إنشاء حساب خاص بك أو تسجيل الدخول للاستفادة من الميزات الإضافية.</p>

        <!-- قسم تسجيل الدخول -->
        <div class="auth-container" id="auth-form-container">
            <h3>تسجيل الدخول / حساب جديد</h3>
            <input type="email" id="email" placeholder="البريد الإلكتروني">
            <input type="password" id="password" placeholder="كلمة المرور">
            <button onclick="register()">إنشاء حساب جديد</button>
            <button onclick="login()">تسجيل الدخول</button>
        </div>

        <!-- قسم ما بعد تسجيل الدخول -->
        <div class="auth-container" id="user-info">
            <h3 style="color: var(--gold);">أهلاً بك، تم تسجيل دخولك بنجاح!</h3>
            <p id="user-email-display"></p>
            <button onclick="logout()" style="background-color: #ff6b6b; color: white;">تسجيل الخروج</button>
        </div>
    </div>

    <!-- كود ربط Firebase (قمنا بوضعه هنا) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ضع إعداداتك هنا بدلاً من القيم الافتراضية إذا رغبت، أو اتركها إن وضعتها مسبقاً
        const firebaseConfig = {
            apiKey: "AIzaSyDfyatwtr2AchAO32aiYS4lhUm2dinYMX⁠",
            authDomain: "⁠my-portfolio-app-c0eb4.firebaseapp.com⁠",
            projectId: "⁠my-portfolio-app-c0eb4",
            storageBucket: "my-portfolio-app-c0eb4.firebasestorage.app⁠",
            messagingSenderId: "695303506163",
            appId: "1695303506163:web:9b2e0b5ffa7d8f32e74f32e74f86⁠",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.register = function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert("تم إنشاء الحساب بنجاح!");
                })
                .catch((error) => {
                    alert("خطأ: " + error.message);
                });
        }

        window.login = function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert("تم تسجيل الدخول بنجاح!");
                })
                .catch((error) => {
                    alert("خطأ في بيانات الدخول: " + error.message);
                });
        }

        window.logout = function() {
            signOut(auth).then(() => {
                alert("تم تسجيل الخروج.");
            });
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-form-container').style.display = 'none';
                document.getElementById('user-info').style.display = 'block';
                document.getElementById('user-email-display').innerText = user.email;
                document.getElementById('auth-status').innerText = "متصل";
            } else {
                document.getElementById('auth-form-container').style.display = 'block';
                document.getElementById('user-info').style.display = 'none';
                document.getElementById('auth-status').innerText = "زائر";
            }
        });
    </script>
</body>
</html>
